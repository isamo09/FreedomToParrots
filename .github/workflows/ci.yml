name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  GO_VERSION: "1.27.x"

jobs:
  check:
    name: Format, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build (all platforms, dev placeholder core)
        run: |
          set -e
          targets="linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64 freebsd/arm64 openbsd/amd64 openbsd/arm64"
          for t in $targets; do
            os=${t%/*}; arch=${t#*/}
            echo "building $os/$arch"
            flags=""
            [ "$os" = "windows" ] && flags="-H windowsgui"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags "$flags" -o /dev/null ./cmd/fzp
          done

      - name: go test
        run: go test -race -count=1 ./...
